services:
  tv-bingo:
    build: .
    container_name: tv-bingo
    restart: unless-stopped
    ports:
      - "8088:8000"
    volumes:
      - bingo-data:/app/data
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - AI_MODEL=${AI_MODEL:-openai/gpt-4o-mini}
      - DATABASE_PATH=/app/data/bingo.db
    networks:
      - default

volumes:
  bingo-data:
